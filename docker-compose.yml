# Local development only. The credentials below are throwaway values for a
# localhost-bound dev database; they are not secrets.
services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: repsy
      POSTGRES_PASSWORD: repsy
      POSTGRES_DB: repsy
    ports:
      - '127.0.0.1:54320:5432'
    volumes:
      - repsy-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repsy -d repsy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repsy-pg-data:
