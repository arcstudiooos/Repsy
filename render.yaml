# Render Blueprint (D-005). NOT APPLIED YET: deployment is deferred until the founder
# creates the Render account. See docs/runbook.md ("Deploy to Render: PENDING").
#
# Secrets are never stored here: every `sync: false` key is entered in the Render
# dashboard when the Blueprint is first applied.
databases:
  - name: kinetic-db
    databaseName: kinetic
    plan: basic-256mb # paid placeholder; free Postgres instances expire
    postgresMajorVersion: '16'

services:
  - type: web
    name: web
    runtime: node
    plan: starter # the free tier sleeps
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @kinetic/web build
    # The owner URL is only for preDeployCommand; the running app must not see it.
    startCommand: exec env -u MIGRATION_DATABASE_URL pnpm --filter @kinetic/web start
    # Owner-only steps: schema migrations and the pg-boss schema run as the database
    # owner, never as the restricted runtime role (DATABASE_URL, kinetic_app).
    preDeployCommand: DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm --filter @kinetic/db exec prisma migrate deploy && pnpm --filter @kinetic/worker pgboss:migrate
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: kinetic-shared
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: kinetic-db
          property: connectionString

  - type: worker
    name: worker
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --prod=false
    # Only web applies migrations: wait until this build's migrations are in the database, so the new worker never
    # runs against the old schema (go-live 2026-11-06). Uses the runtime role; times out (and keeps the old
    # worker) after 20 minutes.
    preDeployCommand: pnpm --filter @kinetic/db db:wait-migrations
    startCommand: pnpm --filter @kinetic/worker start
    autoDeploy: true
    envVars:
      - fromGroup: kinetic-shared

envVarGroups:
  - name: kinetic-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      # One proxy hop (Render) appends to X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      # Runtime connection: the restricted `kinetic_app` role (packages/db/sql/app-role.sql).
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: ORG_COOKIE_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # PRD I15: the AI assistant (Claude). Blank turns the assistant off.
      - key: ANTHROPIC_API_KEY
        sync: false
      # PRD L11: Cloudflare Stream for adaptive demo video. Blank = MP4 plays as uploaded.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: ANALYTICS_HASH_SECRET
        sync: false
      # Product analytics (S5-4); leave POSTHOG_KEY empty to keep analytics off.
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      # Private bucket for exports (S5-2): required in production (no filesystem fallback).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      # HMAC key for 15-minute export download links (falls back to BETTER_AUTH_SECRET).
      - key: EXPORT_LINK_SECRET
        sync: false
      # Web push (PRD H11): leave both empty to keep push off.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
