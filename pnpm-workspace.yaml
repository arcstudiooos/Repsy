packages:
  - apps/*
  - packages/*
allowBuilds:
  sharp: false
  unrs-resolver: false
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@prisma/engines': true
  prisma: true
minimumReleaseAgeExclude:
  - '@sentry/bundler-plugins@11.10.0'
  - '@sentry/core@11.10.0'
  - '@sentry/node@11.10.0'
  - '@sentry/opentelemetry@11.10.0'
  - '@sentry/server-runtime-injection@11.10.0'
  - '@sentry/server-utils@11.10.0'
  - '@sentry/browser-utils@11.10.0'
  - '@sentry/browser@11.10.0'
  - '@sentry/cloudflare@11.10.0'
  - '@sentry/feedback@11.10.0'
  - '@sentry/nextjs@11.10.0'
  - '@sentry/react@11.10.0'
  - '@sentry/replay-canvas@11.10.0'
  - '@sentry/replay@11.10.0'
  - '@sentry/vercel-edge@11.10.0'
