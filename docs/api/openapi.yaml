openapi: 3.1.0
info:
  title: Kinetic API
  version: v1
  description: |
    The Kinetic web API (`/api/v1`). Every response uses the envelope `{ data, meta? }` or `{ error }`; errors are
    `{ code, message, fieldErrors?, requestId }` with statuses 400/401/403/404/409/422/429/500. Mutations require a
    same-origin `Origin` header (CSRF). Every read and write is scoped to the active organization (signed
    `kinetic_org` cookie); another organization's ids are 404. Generated from `apps/web/src/app/api/v1` (S5-5).
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: Account
  - name: Admin
  - name: Check-ins
  - name: Clients
  - name: Data
  - name: Messages
  - name: Notes
  - name: Organization
  - name: Programs
  - name: Progress
  - name: Review
  - name: Settings
  - name: Workouts
paths:
  /me:
    get:
      tags: [Account]
      summary: "The signed-in user, their memberships and the active organization."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /org:
    get:
      tags: [Organization]
      summary: "The active organization."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Organization]
      summary: "Update the organization (owner)."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /org/switch:
    post:
      tags: [Organization]
      summary: "Make another membership\"s organization active (sets the signed org cookie)."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /settings:
    get:
      tags: [Settings]
      summary: "Profile, organization, notifications and pilot access for the acting user."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Settings]
      summary: "Update settings sections."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /settings/setup-checklist:
    put:
      tags: [Settings]
      summary: "Hide or show the dashboard setup checklist for the calling coach (PRD A5). Body: {hidden: boolean}."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sessions/revoke-all:
    post:
      tags: [Account]
      summary: "Sign out every other session of this user."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /auth/invite/accept:
    post:
      tags: [Clients]
      summary: "Accept a client invite (token, consent) and create or link the account."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients:
    get:
      tags: [Clients]
      summary: "List clients (search, status filter, cursor)."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Clients]
      summary: "Create a client (within the active-client limit)."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/import:
    post:
      tags: [Clients]
      summary: "Import clients from a roster (PRD B17). Body: rows[] of {name, email, goals?, timezone?, units?} (at most 500) and dryRun?. Returns per-row results; rows that fail validation, duplicate an email or exceed the active-client limit are skipped, not rejected. No invites are sent."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Clients]
      summary: "One client, with invite status, pause and check-in day."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Clients]
      summary: "Update name, goals, start date or status (pausing goes through /pause)."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/calendar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Clients]
      summary: "A month (?month=YYYY-MM, default this month) of the client's workouts and check-ins over whole weeks, in the client's time zone (PRD C16)."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/invite:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Clients]
      summary: "Send or resend the invite (7-day, single-use link)."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Clients]
      summary: "Revoke the pending invite."
      responses:
        '204': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/assignment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Programs]
      summary: "The client\"s active assignment, or null."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Programs]
      summary: "Last logged sets per exercise (builder performance rail)."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/pause:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Clients]
      summary: "Pause the program (D-003); replaying the same dates is a no-op."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Clients]
      summary: "Change the expected resume date."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/pause/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Clients]
      summary: "Resume now."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/checkin-schedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Check-ins]
      summary: "Set or clear the weekly check-in day."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/thread:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Messages]
      summary: "The client\"s conversation (created on first open)."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/notes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Notes]
      summary: "Private notes about the client (coach/owner only)."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Notes]
      summary: "Add a private note."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/metrics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Progress]
      summary: "Body metrics per metric, newest first (PRD E1). A client reads only their own."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Progress]
      summary: "Record or change one day's value in the client's units; a coach changing a value gives a reason."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [metric, measuredOn, value]
              properties:
                metric: { type: string, enum: [weight, body_fat, waist, hips, chest, arm, thigh, resting_hr, steps] }
                measuredOn: { type: string, format: date }
                value: { type: number }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/habits:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Progress]
      summary: "Habits and tasks with recent ticks, streaks and completion (PRD G1-G3). A client reads only their own."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Progress]
      summary: "A coach assigns a habit (repeats on N days a week) or a one-off task."
      requestBody:
        content: { application/json: { schema: { type: object, required: [title] } } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /habits/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Progress]
      summary: "Archive or restore a habit or task (coach)."
      requestBody:
        content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [active, archived] } } } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /habits/{id}/log:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Progress]
      summary: "Tick a habit for today or the two days before, untick with done=false, or mark a task done."
      requestBody:
        content: { application/json: { schema: { type: object, properties: { localDate: { type: string, format: date }, value: { type: integer }, done: { type: boolean } } } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /clients/{id}/tags:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Clients]
      summary: "Replace a client's tags (PRD B4)."
      requestBody:
        content: { application/json: { schema: { type: object, required: [tagIds], properties: { tagIds: { type: array, items: { type: string } } } } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tags:
    get:
      tags: [Clients]
      summary: "The organization's client tags with how many clients carry each (PRD B4)."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Clients]
      summary: "Create a tag; names are unique per organization, ignoring case."
      requestBody:
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, color: { type: string, enum: [teal, blue, purple, orange, red, gray] } } } } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tags/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Clients]
      summary: "Delete a tag and remove it from every client."
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/context:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Notes]
      summary: "The client context card: goals, why they came, schedule, equipment, preferences, pinned notes (PRD B7). Coaches only."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Notes]
      summary: "Update the context fields given; an empty string clears one."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/nutrition:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Progress]
      summary: "Today's targets, the last 28 days of totals and adherence within 10% (PRD G6/G7). A client reads only their own."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/nutrition/target:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Progress]
      summary: "A coach sets daily calorie and macro targets from a date on."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /clients/{id}/nutrition/log:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Progress]
      summary: "Log a day's totals (today or up to 7 days back); saving again replaces that day."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /org/review-rules:
    get:
      tags: [Organization]
      summary: "Opt-in review rules (PRD I3): enabled rules (habit_low, program_ending, reply_overdue, weight_change), the weight band and the reply time reply_overdue uses."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Organization]
      summary: "Owner only. Body: {enabled: string[], weightChangeBandPct?: 1-20 | null}; weight_change needs a band."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /org/reply-expectations:
    get:
      tags: [Messages]
      summary: "Usual reply time and office hours shown to clients (PRD H16)."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Messages]
      summary: "Set them (owner only): replyTargetHours one of 4, 12, 24, 48, 72 or null; officeHours text."
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /saved-replies:
    get:
      tags: [Messages]
      summary: "The workspace's saved replies (PRD H4). Coaches only."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
