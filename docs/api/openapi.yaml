components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie (database sessions).
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, EDIT_WINDOW_CLOSED, NOT_FOUND, CONFLICT, ORG_SELECTION_REQUIRED, ALREADY_ONBOARDED, CLIENT_LIMIT_REACHED, ACTIVE_ASSIGNMENT_EXISTS, EMAIL_TAKEN, SESSION_NOT_STARTED, SESSION_FINISHED, VALIDATION, PILOT_CODE_INVALID, INVITE_INVALID, INVITE_EXPIRED, INVITE_USED, INVITE_REVOKED, RATE_LIMITED, INTERNAL] }
            message: { type: string }
            fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }
            requestId: { type: string }
    Envelope:
      type: object
      properties:
        data: {}
        meta: { type: object }
  responses:
    Ok:
      description: Success
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
