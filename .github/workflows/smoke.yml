name: Smoke (staging)

# Manual only. Needs a deployed environment (see docs/runbook.md, "Deploy to Render").
on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: Base URL of the deployed web service (https://...)
        required: true

# Least privilege for the job token: these workflows only read the repository.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      STAGING_URL: ${{ inputs.staging_url }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kinetic/web exec playwright install --with-deps chromium
      - run: pnpm --filter @kinetic/web exec playwright test e2e/smoke.spec.ts
