name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kinetic
          POSTGRES_PASSWORD: kinetic
          POSTGRES_DB: kinetic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinetic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://kinetic:kinetic@localhost:5432/kinetic_test
      APP_BASE_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Production build. Placeholder-but-valid values: nothing here is a real secret,
      # and no provider is contacted at build time.
      - run: pnpm --filter @kinetic/web build
        env:
          NODE_ENV: production
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
          NEXT_PUBLIC_SENTRY_DSN: ''
      - run: pnpm --filter @kinetic/web exec playwright install --with-deps
      - run: pnpm test:e2e
